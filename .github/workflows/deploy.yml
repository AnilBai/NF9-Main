name: NF9 Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "VITE_WP_API_URL=${{ secrets.VITE_WP_API_URL }}" >> .env
          echo "VITE_API_CONTACT_URL=${{ secrets.VITE_API_CONTACT_URL }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" >> .env

      - name: Build Project
        run: npm run build

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Test SSH connection
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "echo Connected && ls /home/u940599466/domains/nf9.in/public_html"

      - name: Deploy via rsync
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e rsync -avz --progress \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/home/u940599466/domains/nf9.in/public_html/
