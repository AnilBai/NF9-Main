name: NF9 Deploy

on:
  schedule:
    - cron: '41 5 19 3 *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Create env file
        run: echo "VITE_WP_API_URL=${{ secrets.VITE_WP_API_URL }}" >> .env

      - name: Build Project
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local_path: ./dist/*
          remote_path: /home/u940599466/domains/nf9.in/public_html/
          sftp_only: true