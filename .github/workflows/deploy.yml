name: NF9 Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Node.js
      # ----------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ----------------------------------------
      # 3. Install dependencies
      # ----------------------------------------
      - name: Install Dependencies
        run: npm ci


      # ----------------------------------------
      # 4. Create production environment file
      # ----------------------------------------
      - name: Create env file
        run: |
          echo "VITE_WP_API_URL=${{ secrets.VITE_WP_API_URL }}" >> .env
          echo "VITE_API_CONTACT_URL=${{ secrets.VITE_API_CONTACT_URL }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" >> .env


      # ----------------------------------------
      # 5. Build Vite application
      # ----------------------------------------
      - name: Build Project
        run: npm run build


      # ----------------------------------------
      # 6. Install FTP deployment tool
      # ----------------------------------------
      - name: Install FTP Deploy Tool
        run: |
          echo "FTP deployment will be handled by GitHub Action"


      # ----------------------------------------
      # 7. Deploy to Hostinger via FTP
      # ----------------------------------------
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./dist/
          server-dir: public_html/
          log-level: standard
