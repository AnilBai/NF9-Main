name: NF9 Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 17 18 3 *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: echo "VITE_WP_API_URL=${{ secrets.VITE_WP_API_URL }}" >> .env

      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /home/u940599466/domains/nf9.in/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-admin/**
            wp-content/**
            wp-includes/**
            wp-config.php
            wp-login.php
            wp-cron.php
            xmlrpc.php
            readme.html
            license.txt
            llms.txt
            default.php
            index.php
            .htaccess
